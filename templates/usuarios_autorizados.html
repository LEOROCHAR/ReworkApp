{% extends 'base.html' %}

{% block title %}Usuarios Autorizados{% endblock %}

{% block content %}
    <h1>Usuarios Autorizados</h1>

    <h2>Lista de Usuarios</h2>
    <ul class="list-group">
        {% for usuario in usuarios %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ usuario }}
                <form method="POST" action="{{ url_for('eliminar_usuario', usuario=usuario) }}" style="display: inline;">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </li>
        {% endfor %}
    </ul>

    <h2>Agregar Usuario</h2>
    <form method="POST" class="mt-3">
        <div class="mb-3">
            <label for="nuevo_usuario" class="form-label">Nombre de usuario:</label>
            <input type="text" name="nuevo_usuario" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Agregar</button>
    </form>
{% endblock %}
